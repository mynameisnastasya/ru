        run: |
          printf '%s' "$PATCH_GZ" | tr -d ' ' | base64 --decode | gzip --decompress > /tmp/gurudreads-polish.patch
          git apply --check /tmp/gurudreads-polish.patch
          git apply /tmp/gurudreads-polish.patch
          printf '%s' "$JS_GZ" | tr -d ' ' | base64 --decode | gzip --decompress > assets/site.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/site.css assets/site.js
          git commit -m "Polish GuruDreads release: UX, a11y, SEO and mobile"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload polished site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy polished site
        id: deployment
        uses: actions/deploy-pages@v4
