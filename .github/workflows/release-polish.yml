name: One-time GuruDreads release polish

on:
  push:
    paths:
      - .github/workflows/release-polish.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gurudreads-release-polish
  cancel-in-progress: true

