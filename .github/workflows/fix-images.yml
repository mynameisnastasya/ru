name: Diagnose remaining GuruDreads images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-images.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode hero copper and warm
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          for name in hero copper warm; do
            file "assets/${name}.webp"
            ffmpeg -hide_banner -loglevel error -y -i "assets/${name}.webp" -frames:v 1 "/tmp/${name}.png"
            test -s "/tmp/${name}.png"
            echo "VALID: ${name}"
          done
