name: Localize GuruDreads brand imagery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-images.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download credited GuruDreads imagery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 --user-agent "Mozilla/5.0"             "https://i0.wp.com/www.weddingforward.com/wp-content/uploads/2023/07/wedding-hairstyles-for-dreadlocks-human-hair-extension-ombre-long-gurudreads.jpg?fit=1080%2C1350&quality=70&ssl=1"             -o assets/blonde.jpg
          curl -L --fail --retry 3 --user-agent "Mozilla/5.0"             "https://i0.wp.com/www.weddingforward.com/wp-content/uploads/2023/07/wedding-hairstyles-for-dreadlocks-human-hair-extension-ombre-gurudreads.jpg?fit=1080%2C1350&quality=70&ssl=1"             -o assets/ombre.jpg
          test -s assets/blonde.jpg
          test -s assets/ombre.jpg
          file assets/blonde.jpg assets/ombre.jpg

      - name: Make every site image local
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          long="https://i0.wp.com/www.weddingforward.com/wp-content/uploads/2023/07/wedding-hairstyles-for-dreadlocks-human-hair-extension-ombre-long-gurudreads.jpg?fit=1080%2C1350&quality=70&ssl=1"
          regular="https://i0.wp.com/www.weddingforward.com/wp-content/uploads/2023/07/wedding-hairstyles-for-dreadlocks-human-hair-extension-ombre-gurudreads.jpg?fit=1080%2C1350&quality=70&ssl=1"
          s=s.replace(long,"assets/blonde.jpg").replace(regular,"assets/ombre.jpg")
          p.write_text(s,encoding="utf-8")
          PY
          ! grep -q "i0.wp.com" index.html

      - name: Commit production assets
        shell: bash
        run: |
          rm -f .github/workflows/localize-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Localize GuruDreads production imagery"
          git push
